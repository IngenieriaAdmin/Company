  </defs>
  <circle cx="150" cy="150" r="130" fill="url(#g1)"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="10"/>

  <!-- bar chart -->

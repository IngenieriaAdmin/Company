  <rect x="128" y="130" width="16" height="65" rx="3" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="151" y="115" width="16" height="80" rx="3" fill="#ffffff" fill-opacity="0.85"/>

  <!-- magnifying glass -->

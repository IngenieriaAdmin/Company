    <rect x="554" y="146" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="642" y="146" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <!-- row 2 -->
    <rect x="114" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="202" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="290" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="378" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="466" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="554" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="642" y="218" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <!-- row 3 -->
    <rect x="114" y="290" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="202" y="290" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="290" y="290" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="378" y="290" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="466" y="290" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>
    <rect x="554" y="290" width="76" height="66" rx="6" fill="#fafbfc" stroke="#eef1f5"/>

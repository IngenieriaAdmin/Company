    <text x="396" y="132" font-size="10" fill="#8a94a6">Jue</text>
    <text x="484" y="132" font-size="10" fill="#8a94a6">Vie</text>
    <text x="572" y="132" font-size="10" fill="#8a94a6">Sáb</text>
    <text x="660" y="132" font-size="10" fill="#8a94a6">Dom</text>
  </g>

  <g>

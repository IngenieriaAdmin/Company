<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Social Panel">
  <rect width="800" height="500" fill="#f5f7fa"/>
  <rect width="800" height="50" fill="#37517e"/>
  <circle cx="26" cy="25" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="25" r="6" fill="#febc2e"/>
  <circle cx="66" cy="25" r="6" fill="#28c840"/>
  <text x="400" y="30" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#ffffff">Social Panel &#8212; Calendario</text>

  <rect x="0" y="50" width="70" height="450" fill="#2c3e58"/>
  <circle cx="35" cy="90" r="11" fill="#47b2e4"/>
  <circle cx="35" cy="126" r="11" fill="#57647f"/>
  <circle cx="35" cy="162" r="11" fill="#57647f"/>
  <circle cx="35" cy="198" r="11" fill="#57647f"/>

  <rect x="94" y="78" width="628" height="358" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="114" y="106" font-family="'Open Sans', sans-serif" font-size="13" font-weight="600" fill="#37517e">Septiembre 2026</text>

  <!-- Calendar grid: 7 columns x 4 rows -->
  <g font-family="'Open Sans', sans-serif">

    <!-- scheduled post dots -->
    <circle cx="130" cy="162" r="5" fill="#47b2e4"/>
    <rect x="122" y="172" width="52" height="5" rx="2.5" fill="#c3cbd6"/>

    <circle cx="306" cy="162" r="5" fill="#28c840"/>
    <rect x="298" y="172" width="52" height="5" rx="2.5" fill="#c3cbd6"/>

    <circle cx="482" cy="234" r="5" fill="#9b59d0"/>
    <rect x="474" y="244" width="52" height="5" rx="2.5" fill="#c3cbd6"/>
    <circle cx="482" cy="252" r="5" fill="#47b2e4"/>

    <circle cx="218" cy="306" r="5" fill="#febc2e"/>
    <rect x="210" y="316" width="52" height="5" rx="2.5" fill="#c3cbd6"/>

    <circle cx="658" cy="306" r="5" fill="#47b2e4"/>
    <rect x="650" y="316" width="52" height="5" rx="2.5" fill="#c3cbd6"/>

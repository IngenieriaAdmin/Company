<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="English AI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37517e"/>
      <stop offset="100%" stop-color="#1f2f4d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <text x="400" y="46" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#ffffff">English AI</text>
  <text x="400" y="72" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="14" fill="rgba(255,255,255,0.75)">Tutor de inglés conversacional</text>

  <!-- Phone frame -->
  <rect x="298" y="96" width="204" height="380" rx="26" fill="#0f1b2d" stroke="#3a4a63" stroke-width="2"/>
  <rect x="310" y="118" width="180" height="336" rx="4" fill="#f5f7fa"/>
  <rect x="360" y="102" width="80" height="10" rx="5" fill="#0f1b2d"/>

  <!-- Chat header -->
  <rect x="310" y="118" width="180" height="34" fill="#37517e"/>
  <circle cx="326" cy="135" r="9" fill="#47b2e4"/>
  <rect x="342" y="129" width="70" height="7" rx="3.5" fill="#ffffff"/>
  <rect x="342" y="140" width="40" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>

  <!-- Chat bubbles -->
  <rect x="322" y="164" width="120" height="34" rx="12" fill="#e3e8ee"/>
  <rect x="332" y="174" width="90" height="6" rx="3" fill="#57647f"/>
  <rect x="332" y="184" width="60" height="6" rx="3" fill="#57647f"/>

  <rect x="358" y="210" width="122" height="34" rx="12" fill="#47b2e4"/>
  <rect x="368" y="220" width="90" height="6" rx="3" fill="#ffffff"/>
  <rect x="368" y="230" width="55" height="6" rx="3" fill="rgba(255,255,255,0.8)"/>

  <rect x="322" y="256" width="140" height="34" rx="12" fill="#e3e8ee"/>
  <rect x="332" y="266" width="110" height="6" rx="3" fill="#57647f"/>
  <rect x="332" y="276" width="70" height="6" rx="3" fill="#57647f"/>

  <!-- Correction chip -->
  <rect x="322" y="300" width="150" height="24" rx="12" fill="#e3f7ea"/>
  <text x="397" y="316" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="10" fill="#1f9d55">✓ Pronunciación correcta</text>

  <!-- Progress bar -->
  <rect x="322" y="400" width="146" height="10" rx="5" fill="#e3e8ee"/>
  <rect x="322" y="400" width="98" height="10" rx="5" fill="#47b2e4"/>
  <text x="322" y="392" font-family="'Open Sans', sans-serif" font-size="9" fill="#8a94a6">Progreso del nivel</text>

  <!-- Mic button -->
  <circle cx="400" cy="436" r="16" fill="#47b2e4"/>
  <rect x="396" y="428" width="8" height="12" rx="4" fill="#ffffff"/>
  <path d="M392 438 a8 8 0 0 0 16 0" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-label="Por qué elegir a Nodexa">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37517e"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
  </defs>

  <!-- connecting lines to satellite nodes -->
  <g stroke="#c9d8e6" stroke-width="2" fill="none">
    <line x1="250" y1="210" x2="90" y2="110"/>
    <line x1="250" y1="210" x2="80" y2="300"/>
    <line x1="250" y1="210" x2="420" y2="120"/>
    <line x1="250" y1="210" x2="430" y2="300"/>
  </g>

  <!-- central shield -->
  <path d="M250 60 L360 100 L360 210 C360 290 310 340 250 365 C190 340 140 290 140 210 L140 100 Z" fill="url(#shieldGrad)"/>
  <path d="M195 210 L235 250 L310 165" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- satellite nodes -->
  <circle cx="90" cy="110" r="14" fill="#8fd0ef"/>
  <circle cx="80" cy="300" r="10" fill="#37517e"/>
  <circle cx="420" cy="120" r="10" fill="#37517e"/>
  <circle cx="430" cy="300" r="14" fill="#8fd0ef"/>

  <!-- floating info cards (honest claims, no invented stats) -->
  <rect x="10" y="30" width="168" height="56" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="26" y="52" font-family="'Open Sans', sans-serif" font-size="11" fill="#8a94a6">Código</text>
  <text x="26" y="72" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#37517e">100% a la medida</text>

  <rect x="322" y="330" width="168" height="56" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="338" y="352" font-family="'Open Sans', sans-serif" font-size="11" fill="#8a94a6">Comunicación</text>
  <text x="338" y="372" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#37517e">Contacto directo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Red de nodos Nodexa">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#47b2e4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#47b2e4" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes pulse {
        0%, 100% { r: 34px; opacity: 1; }
        50% { r: 40px; opacity: 0.82; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.9; }
      }
      .hub { animation: pulse 3.2s ease-in-out infinite; transform-origin: 300px 300px; }
      .hubGlowCircle { animation: glowPulse 3.2s ease-in-out infinite; transform-origin: 300px 300px; }
    </style>
  </defs>

  <!-- glow behind hub -->
  <circle class="hubGlowCircle" cx="300" cy="300" r="130" fill="url(#hubGlow)"/>

  <!-- outer ring connections -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <line x1="300" y1="120" x2="460" y2="190"/>
    <line x1="460" y1="190" x2="500" y2="340"/>
    <line x1="500" y1="340" x2="420" y2="480"/>
    <line x1="420" y1="480" x2="260" y2="520"/>
    <line x1="260" y1="520" x2="120" y2="430"/>
    <line x1="120" y1="430" x2="90" y2="260"/>
    <line x1="90" y1="260" x2="170" y2="150"/>
    <line x1="170" y1="150" x2="300" y2="120"/>
  </g>

  <!-- spokes from hub -->
  <g stroke="#47b2e4" stroke-opacity="0.45" stroke-width="2" fill="none">
    <line x1="300" y1="300" x2="300" y2="120"/>
    <line x1="300" y1="300" x2="460" y2="190"/>
    <line x1="300" y1="300" x2="500" y2="340"/>
    <line x1="300" y1="300" x2="420" y2="480"/>
    <line x1="300" y1="300" x2="260" y2="520"/>
    <line x1="300" y1="300" x2="120" y2="430"/>
    <line x1="300" y1="300" x2="90" y2="260"/>
    <line x1="300" y1="300" x2="170" y2="150"/>
  </g>

  <!-- traveling data pulses -->
  <circle r="4" fill="#ffffff">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M300,300 L300,120"/>
  </circle>
  <circle r="4" fill="#ffffff">
    <animateMotion dur="3.1s" repeatCount="indefinite" path="M300,300 L500,340"/>
  </circle>
  <circle r="3.5" fill="#ffffff">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M300,300 L260,520"/>
  </circle>

  <!-- outer nodes -->
  <g>
    <circle cx="300" cy="120" r="16" fill="#ffffff"/>
    <circle cx="460" cy="190" r="12" fill="#8fd0ef"/>
    <circle cx="500" cy="340" r="18" fill="#ffffff"/>
    <circle cx="420" cy="480" r="14" fill="#8fd0ef"/>
    <circle cx="260" cy="520" r="16" fill="#ffffff"/>
    <circle cx="120" cy="430" r="12" fill="#8fd0ef"/>
    <circle cx="90"  cy="260" r="18" fill="#ffffff"/>
    <circle cx="170" cy="150" r="14" fill="#8fd0ef"/>
  </g>

  <!-- central hub -->
  <circle class="hub" cx="300" cy="300" r="34" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="14" fill="#37517e"/>
</svg>
